# a client draws its chain among all relays, so any relay may be an entry and
# any relay may be the hop before another: a cell port takes connections from
# client pods and from relay pods and from nothing else. info stays open to the
# namespace: a client asks its entry there for the descriptors, and every node
# asks the other nodes for theirs
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: relay
  namespace: jimichi
spec:
  podSelector:
    matchLabels: {app: relay}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app: client}
        - podSelector:
            matchLabels: {app: relay}
      ports:
        - {protocol: TCP, port: 9000}
    - from:
        - podSelector: {}
      ports:
        - {protocol: TCP, port: 9100}
